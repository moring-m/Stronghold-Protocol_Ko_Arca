<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <!-- A landscape game: no page zoom (iOS additionally needs the gesture handling of js/ui/device.js), full-bleed behind
       notches (viewport-fit=cover; css/devices.css keeps the HUD inside the safe area). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0f0e" />
  <meta name="color-scheme" content="dark" />
  <meta name="format-detection" content="telephone=no" />
  <!-- "Add to Home Screen" (iOS / Android) opens full screen without browser bars -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="위수 협의" />
  <meta name="description" content="위수 협의: 맹약 · 비공식 팬 제작 웹 게임" />
  <title>위수 협의: 맹약 · STRONGHOLD PROTOCOL</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
  <link rel="icon" href="/icons/favicon.ico" sizes="any" />
  <link rel="icon" href="/icons/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/icons/favicon-48.png" type="image/png" sizes="48x48" />

  <!-- Web fonts: never render-blocking (LAN/offline play must still start); system fallbacks in theme.css. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" data-web-fonts
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Oxanium:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" />
  <script src="/js/webFonts.js" defer></script>
  <link rel="preload" href="/ui-fonts/bender-regular.otf" as="font" type="font/otf" crossorigin />
  <!-- Self-hosted Bender / Novecento (provided by the assets pipeline). -->
  <link id="resource-fonts" rel="stylesheet" href="/css/font-placeholder.css" />

  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/settings.css" />
  <link rel="stylesheet" href="/css/screens/title.css" />
  <link rel="stylesheet" href="/css/screens/lobby.css" />
  <link rel="stylesheet" href="/css/screens/room.css" />
  <meta data-screen-style="/css/screens/game.css" />
  <meta data-screen-style="/css/screens/match-popups.css" />
  <meta data-screen-style="/css/screens/protocol-boot.css" />
  <meta data-screen-style="/css/screens/boss-plates.css" />
  <meta data-screen-style="/css/screens/game-shop.css" />
  <meta data-screen-style="/css/screens/game-panels.css" />
  <meta data-screen-style="/css/screens/briefing.css" />
  <meta data-screen-style="/css/screens/draft.css" />
  <meta data-screen-style="/css/screens/result.css" />
  <meta data-screen-style="/css/screens/settle.css" />
  <link rel="stylesheet" href="/css/screens/guide.css" />
  <meta data-screen-style="/css/screens/loadout.css" />
  <meta data-screen-style="/css/screens/stats.css" />
  <meta data-screen-style="/css/screens/sweep.css" />
  <link rel="stylesheet" href="/css/emotes.css" />
  <link rel="stylesheet" href="/css/chat.css" />
  <link rel="stylesheet" href="/css/devices.css" />
  <link rel="stylesheet" href="/css/ui-consistency.css" />

  <script type="importmap">
    { "imports": { "preact": "/vendor/preact.module.js", "preact/hooks": "/vendor/hooks.module.js", "htm": "/vendor/htm.module.js" } }
  </script>
  <link rel="modulepreload" href="/vendor/preact.module.js" />
  <link rel="modulepreload" href="/vendor/hooks.module.js" />
  <link rel="modulepreload" href="/vendor/htm.module.js" />
  <!-- Fetch initial UI code in parallel with worker/cache setup; evaluation still waits for consent. -->
  <link rel="modulepreload" href="/js/main.js" />
</head>
<body>
  <div id="app"></div>

  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot__inner">
      <div class="boot__hex"></div>
      <div class="boot__text">STRONGHOLD PROTOCOL</div>
      <div id="boot-err" class="boot__err"></div>
    </div>
  </div>

  <div class="rotate-hint" role="alert">
    <div class="rotate-hint__phone"></div>
    <div class="rotate-hint__title">기기를 가로로 돌려주세요</div>
    <div>위수 협의: 맹약은 가로 화면에서 원활하게 이용할 수 있습니다</div>
    <button type="button" hidden class="btn btn--secondary btn--sm rotate-hint__pwa" id="rotate-hint-pwa">홈 화면에 추가</button>
    <div class="rotate-hint__micro">ROTATE DEVICE</div>
  </div>

  <noscript><p style="color:#c3cbc7;text-align:center;padding:40px">게임을 실행하려면 JavaScript를 활성화해야 합니다.</p></noscript>
  <script src="/js/boot-diagnostics-1.js"></script>
  <script type="module" src="/js/resource-bootstrap.js"></script>
  <script nomodule src="/js/boot-unsupported.js"></script>
  <script src="/js/boot-diagnostics-2.js"></script>

</body>
</html>
